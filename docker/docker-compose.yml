name: browsekit

services:
  browsekit-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: browsekit-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS}
      ENABLE_OLLAMA_API: ${ENABLE_OLLAMA_API}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP}
    volumes:
      - browsekit-open-webui-data:/app/backend/data
    networks:
      - browsekit-net

  browsekit-tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    image: browsekit-tools:local
    container_name: browsekit-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8932:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MCPO_API_KEY: ${MCPO_API_KEY}
    volumes:
      # 只允许挂载工作区；禁止挂项目根目录、docker\、.env、chrome-profile\
      - ../workspace:/workspace
      - ./mcpo-config.json:/app/config.json:ro
      # 依赖缓存：避免每次重建容器都重新联网拉取 npx / uvx 包
      - browsekit-npm-cache:/root/.npm
      - browsekit-uv-cache:/root/.cache/uv
    command:
      - "--config"
      - "/app/config.json"
      - "--api-key"
      - "${MCPO_API_KEY}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    networks:
      - browsekit-net

networks:
  browsekit-net:
    name: browsekit-net
    driver: bridge

volumes:
  browsekit-open-webui-data:
    name: browsekit-open-webui-data
  browsekit-npm-cache:
    name: browsekit-npm-cache
  browsekit-uv-cache:
    name: browsekit-uv-cache
